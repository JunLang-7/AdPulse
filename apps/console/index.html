<!DOCTYPE html>
<html lang="en"   class="style-lyra"  data-sidebar-type="true"  data-card-shadow="false">

<head>
  <meta charset="UTF-8" />
  <!-- 首帧前定好 .dark/.light，避免「跟随系统」时先闪一帧亮色。规则与 src/context/shadcntheme/ThemeContext.tsx 一致。 -->
  <script>
    try {
      var stored = localStorage.getItem("vite-ui-theme");
      var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
      var resolved = theme === "system"
        ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : theme;
      document.documentElement.classList.add(resolved);
    } catch (error) {
      document.documentElement.classList.add("light");
    }
  </script>
  <link rel="icon" type="image/svg+xml" href="/branding/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/branding/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/branding/favicon-16.png" />
  <link rel="apple-touch-icon" href="/branding/favicon-180.png" />
  <meta name="theme-color" content="#0B1932" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdPulse 控制台</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
